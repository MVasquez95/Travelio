name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/Travelio.slnx
      - run: dotnet build src/Travelio.slnx --configuration Release --no-restore
      - run: dotnet test src/Travelio.Tests/Travelio.Tests.csproj --configuration Release --no-build --verbosity normal
