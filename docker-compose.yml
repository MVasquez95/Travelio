version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: travelio
      POSTGRES_PASSWORD: travelio
      POSTGRES_DB: travelio
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ddl.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  provider-simulator-1:
    build: ./provider-simulator
    container_name: provider-simulator-1
    command: python provider_simulator_1.py --port 9001
    ports:
      - '9001:9001'
  provider-simulator-2:
    build: ./provider-simulator
    container_name: provider-simulator-2
    command: python provider_simulator_2.py --port 9002
    ports:
      - '9002:9002'
  travelio-api:
    build:
      context: .
      dockerfile: src/Travelio.Api/Dockerfile
    container_name: travelio-api
    ports:
      - '8080:80'
    depends_on:
      - postgres
      - redis
      - provider-simulator-1
      - provider-simulator-2
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=travelio;Username=travelio;Password=travelio
      Redis__Configuration: redis:6379
      Providers__Provider1__BaseUrl: http://provider-simulator-1:9001
      Providers__Provider2__BaseUrl: http://provider-simulator-2:9002
  travelio-worker:
    build:
      context: .
      dockerfile: src/Travelio.Workers/Dockerfile
    depends_on:
      - postgres
      - redis
      - provider-simulator-1
      - provider-simulator-2
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=travelio;Username=travelio;Password=travelio
      Redis__Configuration: redis:6379
      Providers__Provider1__BaseUrl: http://provider-simulator-1:9001
      Providers__Provider2__BaseUrl: http://provider-simulator-2:9002
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:9.5.0
    container_name: grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
volumes:
  pgdata:
