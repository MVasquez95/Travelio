version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: travelio
      POSTGRES_PASSWORD: travelio
      POSTGRES_DB: travelio
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  provider-simulator-1:
    image: python:3.11-slim
    container_name: provider-simulator-1
    volumes:
      - ./:/app:ro
    working_dir: /app
    command: python provider_simulator_1.py --port 9001
    ports:
      - '9001:9001'
  provider-simulator-2:
    image: python:3.11-slim
    container_name: provider-simulator-2
    volumes:
      - ./:/app:ro
    working_dir: /app
    command: python provider_simulator_2.py --port 9002
    ports:
      - '9002:9002'
  travelio-api:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: travelio-api
    # Placeholder - replace with built image or local build in dev
    command: sleep infinity
    ports:
      - '8080:80'
    depends_on:
      - postgres
      - redis
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:9.5.0
    container_name: grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
volumes:
  pgdata:
