openapi: 3.0.3
info:
  title: Travelio API
  version: 1.1.0
  description: B2B travel aggregation MVP.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /search:
    post:
      summary: Search and normalize provider offers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200': { description: Normalized offers }
        '400': { description: Invalid request }
  /prebookings:
    post:
      summary: Create a temporary provider hold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreBookingRequest' }
      responses:
        '201': { description: Hold created }
        '404': { description: Offer not found }
        '409': { description: Offer unavailable or locked }
  /prebookings/{id}:
    get:
      summary: Get a temporary hold
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Hold status }
        '404': { description: Hold not found }
  /bookings:
    post:
      summary: Confirm a hold with idempotency
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201': { description: Booking created }
        '409': { description: Duplicate, expired or incompatible booking request }
  /bookings/{id}:
    get:
      summary: Get a booking
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Booking status }
        '404': { description: Booking not found }
  /bookings/{id}/cancel:
    post:
      summary: Cancel a confirmed booking
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Booking cancelled }
        '404': { description: Booking not found }
        '409': { description: Booking cannot be cancelled }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    SearchRequest:
      type: object
      required: [origin, destination, startDate, endDate, passengers]
      properties:
        origin: { type: string, minLength: 3, maxLength: 3 }
        destination: { type: string, minLength: 3, maxLength: 3 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        passengers: { type: integer, minimum: 1, maximum: 9 }
    PreBookingRequest:
      type: object
      required: [clientId, offerId]
      properties:
        clientId: { type: string }
        offerId: { type: string, format: uuid }
        searchId: { type: string, format: uuid }
    BookingRequest:
      type: object
      required: [clientId, preBookingId]
      properties:
        clientId: { type: string }
        preBookingId: { type: string, format: uuid }
